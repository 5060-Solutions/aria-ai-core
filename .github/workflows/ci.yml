name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The light job: everything that does not need a C++ toolchain.
  #
  # `.cargo/config.toml` already denies warnings and turns on clippy's pedantic
  # and nursery groups, so no extra -D flags are needed here.
  check:
    name: Lint & test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each of these is a configuration someone actually builds. A default-only
        # job cannot see a module that is missing behind a feature flag — which is
        # exactly how every non-default feature once became a hard compile error
        # while CI stayed green.
        features:
          - "--no-default-features"
          - "--no-default-features --features net"
          - "--no-default-features --features insights"
          - "" # default: net, disk-space, insights
          - "--features uniffi"
    steps:
      # Checked out into a subdirectory because [patch.crates-io] resolves the
      # patched -sys crates at ../vendor, relative to this crate.
      - uses: actions/checkout@v4
        with:
          path: aria-ai-core
      - uses: actions/checkout@v4
        with:
          repository: 5060-Solutions/aria-vendor
          ref: fix/sherpa-rs-sys-build-dir
          path: vendor
          token: ${{ secrets.VENDOR_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aria-ai-core
          key: ${{ matrix.features }}

      - name: cargo clippy
        working-directory: aria-ai-core
        run: cargo clippy --all-targets ${{ matrix.features }}

      - name: cargo test
        working-directory: aria-ai-core
        run: cargo test ${{ matrix.features }}

  # The heavy job: whisper.cpp, llama.cpp and onnxruntime all build C/C++, so
  # this is slow and kept separate rather than multiplied across the matrix.
  inference:
    name: Inference backends
    # macOS, not ubuntu. sherpa-rs-sys's download-binaries feature fetches
    # prebuilt onnxruntime and sherpa-onnx for macOS but produced nothing on
    # the Linux runner, while still emitting
    # `cargo:rustc-link-lib=dylib=onnxruntime` and
    # `=sherpa-onnx-c-api` — so the link failed on libraries that were never
    # downloaded. Verified by listing target/ on both: populated locally on
    # macOS, empty in CI.
    #
    # This is also the honest platform for the job: every target that runs
    # these backends is macOS, iOS or Android, and none is Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aria-ai-core
      - uses: actions/checkout@v4
        with:
          repository: 5060-Solutions/aria-vendor
          ref: fix/sherpa-rs-sys-build-dir
          path: vendor
          token: ${{ secrets.VENDOR_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aria-ai-core
          key: all-features

      - name: Install build tooling
        run: brew install cmake ninja

      # whisper.cpp and llama.cpp share one ggml through the patched -sys
      # crates; without that this job fails with
      # `duplicate symbol: ggml_backend_buffer_set_usage`.
      - name: cargo clippy --all-features
        working-directory: aria-ai-core
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo clippy --all-targets --all-features

      # sherpa-rs-sys downloads prebuilt onnxruntime + sherpa-onnx into its
      # OUT_DIR and emits a link-search for them. Linking still fails on this
      # runner with -lonnxruntime / -lsherpa-onnx-c-api, while the same build
      # succeeds locally — so this prints what actually landed before the link
      # step, rather than guessing at the cause.
      - name: Locate the downloaded sherpa/onnx libraries
        working-directory: aria-ai-core
        run: |
          echo "── candidate libs under target/ ──"
          find target -name 'libonnxruntime*' -o -name 'libsherpa-onnx*' 2>/dev/null | head -20
          echo "── build script output dirs ──"
          find target -type d -name 'out' -path '*sherpa*' 2>/dev/null | head -5
          echo "── link directives emitted ──"
          find target -name output -path '*sherpa-rs-sys*' -exec grep -h 'rustc-link' {} + 2>/dev/null | sort -u | head -20

      - name: cargo test --all-features
        working-directory: aria-ai-core
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo test --all-features

  # The catalogue is only useful if the files it names are really there with the
  # digests it claims. This talks to Hugging Face, so it is not on the PR path.
  catalog:
    name: Catalogue points at real files
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          path: aria-ai-core
      - uses: actions/checkout@v4
        with:
          repository: 5060-Solutions/aria-vendor
          ref: fix/sherpa-rs-sys-build-dir
          path: vendor
          token: ${{ secrets.VENDOR_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aria-ai-core

      # Only the small models: enough to prove the URLs, the redirect handling
      # and the digests, without pulling gigabytes on every run.
      - name: Live download, resume and verify
        working-directory: aria-ai-core
        run: |
          cargo test --test live_download -- --ignored --nocapture --test-threads=1 \
            the_smallest_catalogue_model_really_downloads_and_verifies \
            a_partial_download_resumes_from_the_real_cdn

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aria-ai-core
      - uses: actions/checkout@v4
        with:
          repository: 5060-Solutions/aria-vendor
          ref: fix/sherpa-rs-sys-build-dir
          path: vendor
          token: ${{ secrets.VENDOR_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aria-ai-core
      - name: cargo audit
        working-directory: aria-ai-core
        run: |
          cargo install cargo-audit --locked
          cargo audit
